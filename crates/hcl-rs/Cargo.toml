[package]
name = "hcl-rs"
version = "0.20.0"
authors = ["Martin Ohmann <martinohmann@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "HCL parser and formatter for rust with serde support"
repository = "https://github.com/martinohmann/hcl-rs"
documentation = "https://docs.rs/hcl-rs/"
keywords = ["hcl", "serde", "serialization"]
categories = ["encoding"]
readme = "README.md"
edition = "2021"
include = [
  "CHANGELOG.md",
  "Cargo.toml",
  "LICENSE*",
  "README.md",
  "benches/**/*",
  "examples/**/*",
  "src/**/*",
  "tests/**/*"
]

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
all-features = true

[lib]
name = "hcl"
path = "src/lib.rs"

[features]
default = []
perf = ["hcl-edit/perf", "hcl-primitives/perf"]

[dependencies]
indexmap.workspace = true
itoa.workspace = true
hcl-edit.workspace = true
hcl-primitives = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["std"] }
vecmap-rs = { workspace = true, features = ["serde"] }

[dev-dependencies]
indoc.workspace = true
pretty_assertions.workspace = true
serde_json.workspace = true
testdata.workspace = true

[[example]]
name = "in-place-expr-evaluation"
test = true
