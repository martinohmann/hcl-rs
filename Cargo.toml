[workspace]
members = [
    "crates/benchmarks",
    "crates/hcl-edit",
    "crates/hcl-primitives",
    "crates/hcl-rs",
    "crates/hcl2json",
    "crates/specsuite",
    "crates/testdata"
]
resolver = "2"

[workspace.dependencies]
hcl-edit = { version = "0.10.0", path = "crates/hcl-edit" }
hcl-primitives = { version = "0.1.13", path = "crates/hcl-primitives" }
hcl-rs = { version = "0.20.0", path = "crates/hcl-rs" }
testdata = { path = "crates/testdata" }

anyhow = "1.0.98"
assert-json-diff = "2.0.2"
assert_cmd = { version = "2.0.17", features = ["color"] }
clap = { version = "4.5.40", features = ["derive"] }
criterion = "0.8"
fnv = "1.0"
globset = "0.4.16"
indexmap = { version = "2.7.0", features = ["serde"] }
indoc = "2.0"
itoa = "1.0.14"
kstring = { version = "2.0.2", features = ["max_inline"] }
pratt = "0.4.0"
predicates = "3.1.3"
pretty_assertions = "1.4.1"
rayon = "1.10.0"
ryu = "1.0.18"
serde = { version = "1.0.217", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0.140", features = ["preserve_order"] }
textwrap = { version = "0.16.1", default-features = false }
unicode-ident = "1.0.14"
vecmap-rs = "0.3"
walkdir = "2.5.0"
winnow = "1.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
